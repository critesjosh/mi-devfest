<!-- @dsCard group="Cover" height=400 -->
<!-- Cover derived from tokens: dykem (the one accent), granite (header slab), hold and accept (inspection tags), reject (small, used rarely). Punch-hole discs echo the tag hole. -->
<div style="position:relative;width:100%;height:400px;background:var(--paper);overflow:hidden;font-family:var(--font-sans)">
  <div style="position:absolute;left:480px;top:0;width:220px;height:400px;background:var(--granite)">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:28px">
      <span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span>
      <span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span><span style="width:14px;height:14px;border-radius:var(--radius-hole);background:var(--paper)"></span>
    </div>
  </div>
  <div style="position:absolute;left:700px;top:0;width:160px;height:260px;background:var(--dykem)"></div>
  <div style="position:absolute;left:700px;top:260px;width:110px;height:140px;background:var(--hold)"></div>
  <div style="position:absolute;left:810px;top:260px;width:110px;height:140px;background:var(--accept)"></div>
  <div style="position:absolute;left:860px;top:0;width:40px;height:40px;background:var(--reject)"></div>
  <div style="position:absolute;left:40px;bottom:40px;display:grid;gap:8px">
    <div style="font-family:var(--font-display);font-weight:700;font-size:72px;line-height:72px;color:var(--ink)">ShiftProof</div>
    <div style="font-size:18px;line-height:24px;color:var(--ink-muted);max-width:400px">What the work instruction leaves out, reviewed and ready for the next shift.</div>
  </div>
</div>
